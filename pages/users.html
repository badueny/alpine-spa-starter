<div class="card" 
     x-data="{ users: [], isFetching: true }" 
     x-init="fetch('https://jsonplaceholder.typicode.com/users').then(r => r.json()).then(d => { users = d; isFetching = false })">
  <span class="badge">REST API Integration</span>
  <h1>Daftar Pengguna</h1>
  <p class="subtitle">Contoh pengambilan data asinkron menggunakan Fetch API dan x-for.</p>

  <div x-show="isFetching" class="loader-box">
    <div class="spinner"></div>
    <span>Mengambil data dari server...</span>
  </div>

  <div x-show="!isFetching" class="user-grid">
    <template x-for="user in users" :key="user.id">
      <div class="user-item">
        <div class="avatar" x-text="user.name.charAt(0)"></div>
        <div>
          <div class="user-name" x-text="user.name"></div>
          <div class="user-email" x-text="user.email"></div>
        </div>
      </div>
    </template>
  </div>
</div>
