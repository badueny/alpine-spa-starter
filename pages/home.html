<div class="card">
  <span class="badge">SPA Ready • Offline CSS</span>
  <h1 x-text="$store.app.appName"></h1>
  <p class="subtitle">
    Navigasi instan tanpa reload halaman dengan global state reaktif bawaan Alpine.js.
  </p>

  <div style="display: flex; gap: 0.75rem; flex-wrap: wrap;">
    <button @click="$store.app.increment()" class="btn">
      Klik Counter: <span x-text="$store.app.counter"></span>
    </button>
    <button @click="$store.app.counter = 0" class="btn btn-outline">
      Reset
    </button>
  </div>
</div>
