<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alpine.js SPA Starter Kit</title>
  <!-- Tailwind CSS (opsional untuk styling cepat) -->
  <link rel="stylesheet" href="/assets/css/style.css" />
  <!-- App Logic harus dimuat sebelum Alpine.js -->
  <script src="/assets/js/app.js"></script>
  <script defer src="/assets/js/alpine.min.js"></script>
</head>
<body x-data="router()">
  <header class="navbar">
    <nav class="nav-container">
      <a href="/" @click.prevent="navigate('/')" class="brand">
        AlpineSPA <span>v3</span>
      </a>
      <div class="nav-links">
        <a href="/" @click.prevent="navigate('/')" 
           class="nav-link" :class="{ active: currentPath === '/' }">Beranda</a>
        <a href="/users" @click.prevent="navigate('/users')" 
           class="nav-link" :class="{ active: currentPath === '/users' }">Pengguna</a>
      </div>
    </nav>
  </header>

  <main class="container">
    <div x-show="loading" class="loader-box">
      <div class="spinner"></div>
      <span>Memuat halaman...</span>
    </div>
    <div x-show="!loading" x-html="content"></div>
  </main>
</body>
</html>
