<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alpine.js SPA Starter Kit</title>
  <!-- Tailwind CSS (opsional untuk styling cepat) -->
  <script src="https://tailwindcss.com"></script>
  <!-- App Logic harus dimuat sebelum Alpine.js -->
  <script src="/js/app.js"></script>
  <script defer src="/assets/alpine.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-800" x-data="router()">
  <!-- Navbar -->
  <header class="bg-white shadow-sm">
    <nav class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
      <a href="/" @click.prevent="navigate('/')" class="font-bold text-lg text-sky-600">AlpineSPA</a>
      <div class="flex gap-6">
        <a href="/" @click.prevent="navigate('/')" 
           :class="currentPath === '/' ? 'text-sky-600 font-semibold' : 'text-gray-600'">Home</a>
        <a href="/users" @click.prevent="navigate('/users')" 
           :class="currentPath === '/users' ? 'text-sky-600 font-semibold' : 'text-gray-600'">Users (API)</a>
      </div>
    </nav>
  </header>

  <!-- Konten Dinamis -->
  <main class="max-w-4xl mx-auto px-4 py-8">
    <div x-show="loading" class="text-gray-500">Memuat halaman...</div>
    <div x-show="!loading" x-html="content"></div>
  </main>
</body>
</html>
